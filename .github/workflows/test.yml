name: Tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      REM_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Private API capability probe (no user data)
        run: |
          mkdir -p bin
          xcrun clang -fobjc-arc -framework Foundation scripts/reminderkit-probe.m -o bin/reminderkit-probe
          bin/reminderkit-probe
      - name: Reproducible source bundle with dependencies
        run: |
          go mod vendor
          tar -czf "$RUNNER_TEMP/rem-source.tar.gz" go.mod go.sum Makefile LICENSE cmd internal skills vendor scripts
      - uses: actions/upload-artifact@v4
        with:
          name: rem-source
          path: ${{ runner.temp }}/rem-source.tar.gz
          retention-days: 1
      - name: Unit tests (no permission prompts)
        run: go test -race ./...
      - name: Build
        run: go build -o bin/rem ./cmd/rem
      - name: Permission-free CLI smoke tests
        run: |
          bin/rem --help
          bin/rem version
          bin/rem skills status
          bin/rem completion bash > /dev/null
