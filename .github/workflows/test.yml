name: Tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      REM_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests (no permission prompts)
        run: go test -race ./...
      - name: Build
        run: go build -o bin/rem ./cmd/rem
      - name: Permission-free CLI smoke tests
        run: |
          bin/rem --help
          bin/rem version
          bin/rem skills status
          bin/rem completion bash > /dev/null
