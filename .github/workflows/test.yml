name: Tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      REM_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Native boundary tests (synthetic data only)
        run: |
          mkdir -p bin
          xcrun clang -fobjc-arc -fblocks -fsanitize=address,undefined -framework Foundation -framework EventKit scripts/reminderkit-tests.m -o bin/reminderkit-tests
          bin/reminderkit-tests
      - name: Unit tests with race detector (no permission prompts)
        run: go test -race ./...
      - name: Bundled EventKit tests
        working-directory: go-eventkit
        run: go test -race ./...
      - name: Bundled EventKit static analysis
        working-directory: go-eventkit
        run: go vet ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build
        run: go build -o bin/rem ./cmd/rem
      - name: Permission-free CLI smoke tests
        run: |
          bin/rem --help
          bin/rem version
          bin/rem skills status
          bin/rem completion bash > /dev/null
          bin/rem doctor
          bin/rem assign --help
          bin/rem participants --help
          bin/rem sections --help
          bin/rem section create --help
          bin/rem section rename --help
          if bin/rem assign nonexistent someone@example.com --none 2>bin/assign-args-error; then
            echo 'assignment with conflicting arguments unexpectedly succeeded' >&2
            exit 1
          fi
          grep -q -- 'provide a participant or --none, not both' bin/assign-args-error
      - name: Reproducible source bundle with dependencies
        if: always()
        run: |
          go mod vendor
          tar --exclude=.git --exclude=bin -czf "$RUNNER_TEMP/rem-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rem-source
          path: ${{ runner.temp }}/rem-source.tar.gz
          retention-days: 1
